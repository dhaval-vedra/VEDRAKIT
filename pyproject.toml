[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedrakit"
version = "1.1.0"
description = "A dependency-light Python web framework with routing, validation, auth, tasks, docs, and observability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Vedrakit contributors"}]
keywords = ["web", "framework", "api", "http", "jwt", "sqlite", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
]
dependencies = []

[project.scripts]
vedrakit = "vedrakit.cli:main"

[project.urls]
Homepage = "https://github.com/dhaval-vedra/VEDRAKIT"
Documentation = "https://github.com/dhaval-vedra/VEDRAKIT/blob/main/docs/API.md"
Repository = "https://github.com/dhaval-vedra/VEDRAKIT"
Issues = "https://github.com/dhaval-vedra/VEDRAKIT/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]
graphql = ["graphene>=3.3"]
websocket = ["websockets>=12.0"]
grpc = ["grpcio>=1.60"]
postgresql = ["psycopg[binary]>=3.2"]
all = [
    "redis>=5.0",
    "graphene>=3.3",
    "websockets>=12.0",
    "grpcio>=1.60",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["vedrakit*"]
